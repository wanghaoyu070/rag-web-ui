events { worker_connections 1024; }
http {
 client_max_body_size 100M;
 server {
  listen 80;
  location /api { proxy_pass http://backend:8000; proxy_set_header Host $http_host; proxy_buffering off; proxy_read_timeout 300s; }
  location /openapi { proxy_pass http://backend:8000; proxy_set_header Host $http_host; proxy_buffering off; }
  location /redoc { proxy_pass http://backend:8000; }
  location / { proxy_pass http://frontend:3000; proxy_set_header Host $http_host; proxy_http_version 1.1; }
 }
}
